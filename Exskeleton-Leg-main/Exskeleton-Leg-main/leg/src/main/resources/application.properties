spring.application.name=leg
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.etzpnozrapiysnslfnhh}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Giap123@123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.http.converters.preferred-json-mapper=jackson2
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Motion-library timing is controlled by backend deployment configuration.
exo.motion.thigh-raise-low-ms=${EXO_MOTION_THIGH_RAISE_LOW_MS:5000}
exo.motion.thigh-raise-high-ms=${EXO_MOTION_THIGH_RAISE_HIGH_MS:7000}
exo.motion.thigh-lower-ms=${EXO_MOTION_THIGH_LOWER_MS:5000}
exo.motion.knee-bend-low-ms=${EXO_MOTION_KNEE_BEND_LOW_MS:5000}
exo.motion.knee-kick-low-ms=${EXO_MOTION_KNEE_KICK_LOW_MS:5000}
exo.motion.knee-kick-high-ms=${EXO_MOTION_KNEE_KICK_HIGH_MS:7000}
exo.motion.default-rest-after-ms=${EXO_MOTION_DEFAULT_REST_AFTER_MS:1000}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:a-development-secret-with-more-than-32-bytes}
app.jwt.issuer=${JWT_ISSUER:exoskeleton-leg-api}
app.jwt.audience=${JWT_AUDIENCE:exoskeleton-leg-mobile}
app.jwt.access-token-ttl-seconds=${ACCESS_TOKEN_TTL_SECONDS:900}
app.jwt.refresh-token-ttl-seconds=${REFRESH_TOKEN_TTL_SECONDS:2592000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.firebase.service-account=${FIREBASE_SERVICE_ACCOUNT:}
app.firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
